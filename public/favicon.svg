<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle Badge -->
  <circle cx="50" cy="50" r="48" fill="#0F172A" stroke="#F59E0B" stroke-width="4" />
  <circle cx="50" cy="50" r="44" fill="#1E293B" />

  <!-- Radio Dial Lines / Frequency Waves -->
  <path d="M 20 32 Q 35 24 50 32 T 80 32" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 25 24 Q 40 18 50 24 T 75 24" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round" />

  <!-- Vintage Radio Body -->
  <rect x="22" y="38" width="56" height="38" rx="6" fill="#D97706" stroke="#FEF3C7" stroke-width="2" />

  <!-- Radio Speaker Grille -->
  <circle cx="37" cy="57" r="11" fill="#78350F" stroke="#FDE68A" stroke-width="1.5" />
  <circle cx="37" cy="57" r="6" fill="#B45309" />
  <circle cx="37" cy="57" r="2" fill="#FEF3C7" />

  <!-- Radio Tuning Screen -->
  <rect x="52" y="44" width="20" height="12" rx="3" fill="#000000" stroke="#F59E0B" stroke-width="1" />
  <text x="62" y="52.5" font-family="monospace" font-size="6" font-weight="bold" fill="#34D399" text-anchor="middle">92.7</text>

  <!-- Control Knobs -->
  <circle cx="56" cy="64" r="3.5" fill="#FEF3C7" stroke="#92400E" stroke-width="1" />
  <circle cx="68" cy="64" r="3.5" fill="#FEF3C7" stroke="#92400E" stroke-width="1" />

  <!-- Antenna -->
  <line x1="30" y1="38" x2="16" y2="18" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <circle cx="16" cy="18" r="2.5" fill="#FBBF24" />

  <!-- Musical Note / Signal Glow -->
  <path d="M 72 20 Q 76 16 80 20 L 80 28" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="72" cy="20" r="2" fill="#10B981" />
  <circle cx="80" cy="28" r="2" fill="#10B981" />
</svg>