<!doctype html>
<html lang="hi" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <title>सफ़र FM</title>
    <meta name="description" content="सफ़र FM — Nostalgic 90s Indian retro highway bus radio." />
    <meta property="og:title" content="सफ़र FM" />
    <meta property="og:description" content="90s Indian highway bus radio with live co-travelers and ambient engine hum." />

  <body class="h-full bg-black text-white selection:bg-amber-400 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
